name: Smart-Nutrition

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: smart-nutrition-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Smart-Nutrition
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Smart-Nutrition
        uses: actions/checkout@v4

      - name: Smart-Nutrition
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Smart-Nutrition
        run: npm ci

      - name: Smart-Nutrition
        run: npm run quality

      - name: Smart-Nutrition
        run: npm run audit:security

      - name: Smart-Nutrition
        env:
          SMART_NUTRITION_JWT_SECRET: ci-smart-nutrition-quality-secret-1234567890
          SMART_NUTRITION_DATABASE_PROVIDER: mongodb
          SMART_NUTRITION_MONGO_URI: mongodb+srv://ci-user:ci-password@cluster0.smart-nutrition.invalid/smart-nutrition
          SMART_NUTRITION_EMAIL_FROM_ADDRESS: noreply@smart-nutrition.club
          SMART_NUTRITION_EMAIL_FROM_NAME: Smart Nutrition
          SMART_NUTRITION_BREVO_API_KEY: ci_brevo_quality_key_not_a_secret
          SMART_NUTRITION_CORS_ORIGINS: https://smart-nutrition.club,https://www.smart-nutrition.club
          SMART_NUTRITION_AUTH_COOKIE_SAME_SITE: None
          SMART_NUTRITION_AUTH_COOKIE_SECURE: "true"
          SMART_NUTRITION_SERVE_STATIC: "false"
          SMART_NUTRITION_RUNTIME_INSTANCE_COUNT: "1"
        run: npm run server:check
